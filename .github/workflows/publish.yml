name: publish
# A tag v<major>.<minor> (the version of package.json without its .0) uploads the styles to
# https://styles.map-jr.org/<major>/ (scripts/publish.mjs) and makes a GitHub release, whose zip is that release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm test
      - name: The tag is the version of package.json
        run: test "${GITHUB_REF_NAME}.0" = "v$(node -p 'require("./package.json").version')"
      - run: node scripts/publish.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_API_TOKEN: ${{ secrets.R2_API_TOKEN }}
      - name: GitHub release
        run: |
          (cd dist && zip -qr "../map-jr-styles-${GITHUB_REF_NAME}.zip" .)
          gh release create "${GITHUB_REF_NAME}" "map-jr-styles-${GITHUB_REF_NAME}.zip" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
